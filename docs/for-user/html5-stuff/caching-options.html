<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>How should we cache a vision transformer?</title>
<style>
  :root{
    --bg:#02050a;
    --bg-stage:#050a13;
    --ink:#f2ede2;
    --ink-soft:#c5cad4;
    --muted:#8793a5;
    --dim:#5f6b7d;
    --gold:#eec878;
    --gold-bright:#ffe1a0;
    --teal:#7fd4c5;
    --teal-soft:#4c9e96;
    --rose:#d58f9e;
    --rose-deep:#b86f80;
    --line:rgba(238,200,120,.20);
    --line-cool:rgba(127,212,197,.18);
    --line-soft:rgba(226,235,245,.085);
    --panel:rgba(9,18,30,.62);
    --panel-2:rgba(12,24,38,.48);
    --serif:Georgia,"Iowan Old Style","Palatino Linotype","Book Antiqua",Palatino,"Times New Roman",serif;
    --sans:"Segoe UI","Helvetica Neue",Helvetica,Arial,sans-serif;
    --mono:"Cascadia Mono",Consolas,"SFMono-Regular",Menlo,monospace;
    --ease:cubic-bezier(.4,0,.2,1);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  html{background:var(--bg)}
  body{
    margin:0; overflow:hidden; color:var(--ink); background:
      radial-gradient(1200px 900px at 50% 48%, #08111d 0%, #03070d 55%, #010307 100%);
    font-family:var(--serif); -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  }
  ::selection{background:rgba(238,200,120,.26); color:#fff}
  button{font:inherit}
  :focus-visible{outline:2px solid rgba(127,212,197,.85); outline-offset:4px}
  .svg-defs{position:absolute; width:0; height:0; overflow:hidden; pointer-events:none}

  #viewport{position:fixed; inset:0; overflow:hidden}
  #stage{
    position:absolute; left:50%; top:50%;
    width:1600px; height:900px; overflow:hidden;
    transform:translate(-50%,-50%) scale(1); transform-origin:center center;
    background:
      radial-gradient(1050px 720px at 20% 4%, rgba(37,87,99,.22), transparent 64%),
      radial-gradient(960px 760px at 88% 98%, rgba(133,96,50,.08), transparent 62%),
      radial-gradient(720px 600px at 72% 38%, rgba(25,53,75,.11), transparent 72%),
      linear-gradient(180deg,#08111c 0%,#050b14 48%,#040810 100%);
    box-shadow:0 40px 140px rgba(0,0,0,.75), inset 0 0 0 1px rgba(238,200,120,.045);
  }
  #stage::before{
    content:""; position:absolute; inset:0; z-index:2; pointer-events:none;
    background:
      radial-gradient(ellipse at 50% 45%, transparent 24%, rgba(0,3,8,.20) 62%, rgba(0,2,6,.66) 100%),
      linear-gradient(90deg, rgba(0,0,0,.20), transparent 12%, transparent 88%, rgba(0,0,0,.20));
  }
  #stage::after{
    content:""; position:absolute; inset:0; z-index:2; pointer-events:none; opacity:.35;
    background-image:
      linear-gradient(rgba(170,197,213,.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(170,197,213,.035) 1px, transparent 1px);
    background-size:80px 80px;
    -webkit-mask-image:radial-gradient(ellipse at 50% 48%, rgba(0,0,0,.65), transparent 78%);
    mask-image:radial-gradient(ellipse at 50% 48%, rgba(0,0,0,.65), transparent 78%);
  }

  .progress{position:absolute; left:0; top:0; width:100%; height:2px; z-index:20; background:rgba(255,255,255,.045)}
  .progress-fill{height:100%; width:10%; background:linear-gradient(90deg,var(--teal),var(--gold)); box-shadow:0 0 14px rgba(238,200,120,.55); transition:width .6s var(--ease)}

  .hud-top,.hud-bottom{position:absolute; left:82px; right:82px; z-index:20; pointer-events:none}
  .hud-top{top:31px; display:flex; align-items:center; justify-content:space-between}
  .hud-bottom{bottom:25px; display:flex; align-items:center; justify-content:space-between}
  .brand{display:flex; align-items:center; gap:12px; color:#94a1b3; font-family:var(--sans); font-size:12.5px; letter-spacing:.21em; text-transform:uppercase}
  .brand-glyph{width:22px; height:22px; flex:none; opacity:.92}
  .brand em{font-style:normal; color:#c5cbd5}
  .scene-count{display:flex; align-items:baseline; gap:8px; font-family:var(--serif); font-size:18px; color:var(--gold); letter-spacing:.04em}
  .scene-count span{font-family:var(--sans); font-size:12px; letter-spacing:.16em; color:var(--dim)}
  .hint{display:flex; align-items:center; gap:10px; color:#758294; font-family:var(--sans); font-size:13px; letter-spacing:.055em; white-space:nowrap}
  .hint .sep{color:#394654; padding:0 2px}
  .key{display:inline-flex; align-items:center; justify-content:center; min-width:22px; height:21px; padding:0 6px; border:1px solid rgba(199,211,225,.17); border-radius:5px; background:rgba(8,16,26,.56); color:#c2cad5; font-family:var(--sans); font-size:11px; line-height:1; box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}
  .nav{display:flex; align-items:center; gap:9px; pointer-events:auto}
  .nav button{
    appearance:none; -webkit-appearance:none; width:42px; height:42px; border-radius:50%;
    border:1px solid rgba(201,214,229,.14); background:rgba(7,15,25,.72); color:#b9c3d0;
    cursor:pointer; display:inline-flex; align-items:center; justify-content:center;
    font-family:var(--sans); font-size:17px; line-height:1;
    transition:border-color .24s var(--ease), color .24s var(--ease), background .24s var(--ease), box-shadow .24s var(--ease);
  }
  .nav button:not(:disabled):hover{border-color:rgba(238,200,120,.7); color:var(--gold-bright); background:rgba(16,28,41,.9); box-shadow:0 0 24px rgba(238,200,120,.12)}
  .nav button:disabled{opacity:.24; cursor:default}
  .nav .next{border-color:rgba(238,200,120,.30); color:var(--gold)}

  .scene-layer{position:absolute; inset:0; z-index:4}
  .scene{
    position:absolute; inset:0; padding:120px 82px 82px; display:flex; flex-direction:column;
    opacity:0; transform:translate3d(0,0,0); pointer-events:none;
    transition:opacity .64s var(--ease), transform .78s var(--ease);
    will-change:opacity,transform;
  }
  .scene.on{opacity:1; transform:translate3d(0,0,0); pointer-events:auto}
  .scene.leaving{opacity:0 !important}
  [data-reveal]{opacity:0; will-change:opacity,transform}

  .scene-head{flex:0 0 auto; margin-bottom:25px; max-width:1240px}
  .kicker{display:flex; align-items:center; gap:13px; margin:0; font-family:var(--sans); font-size:12px; letter-spacing:.23em; text-transform:uppercase; color:var(--gold)}
  .kicker .dash{display:inline-block; width:35px; height:1px; background:linear-gradient(90deg,rgba(238,200,120,.9),rgba(238,200,120,.08))}
  .scene-head h2{margin:14px 0 0; font-family:var(--serif); font-weight:400; font-size:51px; line-height:1.07; letter-spacing:-.018em; color:var(--ink); text-shadow:0 0 46px rgba(238,200,120,.045)}
  .scene-head h2 em{font-style:italic; color:var(--gold); font-weight:400}
  .lead{margin:13px 0 0; max-width:1080px; font-family:var(--serif); font-size:20px; line-height:1.46; color:#aeb7c5}
  .lead strong{font-weight:400; color:#e9e2d5}
  .scene-body{position:relative; flex:1; min-height:0}
  .micro{font-family:var(--sans); font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:var(--muted)}
  .label{font-family:var(--sans); font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted)}
  .panel{
    border:1px solid var(--line-soft); border-radius:15px;
    background:linear-gradient(155deg,rgba(15,30,45,.56),rgba(5,13,22,.38));
    box-shadow:inset 0 1px 0 rgba(255,255,255,.025), 0 24px 70px rgba(0,0,0,.18);
  }
  .pullquote{
    flex:0 0 auto; border-top:1px solid rgba(226,235,245,.12); padding-top:17px;
    display:flex; align-items:baseline; justify-content:space-between; gap:28px;
    font-family:var(--serif); font-size:36px; line-height:1.22; color:var(--ink);
  }
  .pullquote em{font-style:italic; color:var(--gold)}
  .pullquote .pq-note{font-family:var(--sans); font-size:12px; letter-spacing:.13em; text-transform:uppercase; color:var(--dim); flex:none}
  .number{font-variant-numeric:tabular-nums lining-nums}

  .svg-kicker{font-family:var(--sans); font-size:12px; letter-spacing:.16em; text-transform:uppercase; fill:#8d99aa}
  .svg-tiny{font-family:var(--sans); font-size:12px; letter-spacing:.055em; fill:#758294}
  .svg-label{font-family:var(--sans); font-size:13px; letter-spacing:.10em; fill:#a2adbc}
  .svg-serif{font-family:var(--serif); fill:#f2ede2}
  .svg-model{font-family:var(--serif); font-size:22px; fill:#efe9dc}
  .svg-value{font-family:var(--serif); font-size:32px; fill:#f2ede2; font-variant-numeric:tabular-nums}
  .svg-axis{stroke:rgba(214,226,239,.16); stroke-width:1}
  .svg-grid{stroke:rgba(214,226,239,.075); stroke-width:1}
  .svg-gold{fill:var(--gold)}
  .svg-teal{fill:var(--teal)}
  .svg-rose{fill:var(--rose)}
  .svg-muted{fill:var(--muted)}
  .svg-dim{fill:var(--dim)}
  .glow-gold{filter:url(#f-glow-gold)}
  .glow-teal{filter:url(#f-glow-teal)}

  /* Scene 1 */
  .scene.title-scene{padding:88px 82px 72px; justify-content:center}
  .title-wrap{position:relative; width:100%; height:100%; display:flex; align-items:center}
  .title-copy{position:relative; z-index:3; width:930px}
  .title-kicker{display:flex; align-items:center; gap:14px; font-family:var(--sans); font-size:12px; letter-spacing:.25em; text-transform:uppercase; color:var(--gold)}
  .title-kicker .dash{width:43px; height:1px; background:rgba(238,200,120,.62)}
  .title-copy h1{margin:23px 0 0; font-family:var(--serif); font-weight:400; font-size:82px; line-height:1.02; letter-spacing:-.027em; color:var(--ink); text-shadow:0 0 70px rgba(238,200,120,.055)}
  .title-copy h1 em{font-style:italic; color:var(--gold); position:relative}
  .title-copy h1 em::after{content:""; position:absolute; left:2px; right:2px; bottom:1px; height:1px; background:linear-gradient(90deg,transparent,rgba(238,200,120,.55),transparent); opacity:.65}
  .title-sub{margin:27px 0 0; font-family:var(--serif); font-size:25px; line-height:1.5; color:#b9c1ce; letter-spacing:.002em}
  .title-sub .gold{color:var(--gold-bright)}
  .title-sub .teal{color:var(--teal)}
  .title-tail{margin:43px 0 0; display:flex; align-items:center; gap:12px; color:#6f7c8e; font-family:var(--sans); font-size:11.5px; letter-spacing:.16em; text-transform:uppercase}
  .title-tail .thin{display:inline-block; width:80px; height:1px; background:rgba(199,212,226,.15)}
  .title-art{position:absolute; top:50%; right:0; width:600px; height:660px; transform:translateY(-50%); z-index:2; pointer-events:none}
  .title-art svg{width:100%; height:100%; overflow:visible}
  .orbit-glow{opacity:.42; filter:url(#f-glow-soft)}
  .card-shadow{fill:rgba(0,0,0,.35); filter:url(#f-shadow)}

  /* Scene 2 */
  .s2-layout{display:grid; grid-template-columns:330px minmax(0,1fr); gap:30px; height:100%}
  .model-card{padding:25px 25px 22px; display:flex; flex-direction:column; position:relative; overflow:hidden}
  .model-card::after{content:"B/16"; position:absolute; right:-17px; bottom:68px; font-family:var(--serif); font-size:116px; line-height:1; color:rgba(238,200,120,.035); letter-spacing:-.06em; pointer-events:none}
  .model-name{margin:14px 0 0; font-family:var(--serif); font-size:37px; line-height:1.03; letter-spacing:-.025em; color:var(--ink)}
  .model-name span{color:var(--gold)}
  .model-rule{height:1px; margin:19px 0 8px; background:linear-gradient(90deg,rgba(238,200,120,.30),rgba(238,200,120,.02))}
  .spec-row{display:flex; align-items:baseline; justify-content:space-between; gap:14px; padding:9px 0; border-bottom:1px solid rgba(203,217,232,.065); font-family:var(--sans)}
  .spec-row .sk{font-size:12px; letter-spacing:.11em; text-transform:uppercase; color:var(--dim)}
  .spec-row .sv{font-size:14px; color:#d4d9e1; text-align:right}
  .model-note{margin-top:auto; padding-top:20px; font-family:var(--sans); font-size:12.5px; line-height:1.55; letter-spacing:.02em; color:#8a96a6}
  .model-note b{color:#c5ced9; font-weight:400}
  .chart-panel{padding:18px 22px 17px; display:flex; flex-direction:column; min-height:0}
  .chart-head{display:flex; align-items:baseline; justify-content:space-between; gap:20px; padding:0 5px}
  .chart-head .ch-title{font-family:var(--sans); font-size:12px; letter-spacing:.17em; text-transform:uppercase; color:#9ca8b8}
  .chart-head .ch-note{font-family:var(--sans); font-size:12px; letter-spacing:.05em; color:#687587}
  .macro-svg{display:block; width:100%; height:auto; margin:1px 0 0}
  .metrics{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:0; margin-top:4px; border-top:1px solid rgba(213,225,238,.10)}
  .metric{padding:12px 15px 10px; border-right:1px solid rgba(213,225,238,.075); min-width:0}
  .metric:last-child{border-right:0}
  .metric-name{font-family:var(--sans); font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--dim)}
  .metric-pair{display:flex; justify-content:space-between; align-items:baseline; gap:8px; margin-top:7px}
  .metric-pair .who{font-family:var(--sans); font-size:10.5px; letter-spacing:.055em; color:#697688}
  .metric-val{font-family:var(--serif); font-size:19px; font-variant-numeric:tabular-nums; line-height:1}
  .metric-val.gold{color:var(--gold)}
  .metric-val.rose{color:var(--rose)}
  .mini-track{height:3px; border-radius:3px; background:rgba(183,199,215,.09); margin:5px 0 7px; overflow:hidden}
  .mini-track i{display:block; height:100%; width:0; border-radius:inherit}
  .mini-track i.gold{background:linear-gradient(90deg,#9c7932,var(--gold-bright))}
  .mini-track i.rose{background:linear-gradient(90deg,#78404d,var(--rose))}

  /* Scene 3 */
  .s3-body{display:flex; flex-direction:column}
  .s3-layout{display:grid; grid-template-columns:0.92fr 1.08fr; gap:38px; align-items:center; flex:1; min-height:0}
  .s3-left{padding-left:4px}
  .s3-label{font-family:var(--sans); font-size:11px; letter-spacing:.20em; text-transform:uppercase; color:var(--gold)}
  .time-line{display:flex; align-items:baseline; gap:15px; margin-top:5px}
  .time-number{font-family:var(--serif); font-size:148px; line-height:.96; letter-spacing:-.052em; color:var(--ink); text-shadow:0 0 60px rgba(238,200,120,.07); font-variant-numeric:tabular-nums}
  .time-unit{font-family:var(--serif); font-size:27px; color:var(--gold); letter-spacing:.03em}
  .time-note{margin:2px 0 0; font-family:var(--serif); font-size:19px; color:#8e9aab; font-style:italic}
  .s3-stats{display:grid; grid-template-columns:1fr 1fr; gap:22px; margin-top:37px; padding-top:21px; border-top:1px solid rgba(221,232,242,.11); max-width:605px}
  .s3-stat .big{font-family:var(--serif); font-size:39px; line-height:1; color:var(--ink); letter-spacing:-.02em; font-variant-numeric:tabular-nums}
  .s3-stat .range{font-size:34px; color:var(--teal)}
  .s3-stat .cap{display:block; margin-top:8px; font-family:var(--sans); font-size:12px; line-height:1.45; letter-spacing:.08em; text-transform:uppercase; color:var(--dim)}
  .night-panel{height:100%; min-height:0; position:relative; display:flex; align-items:center; justify-content:center}
  .night-svg{display:block; width:100%; height:auto; max-height:425px; overflow:visible}
  .s3-quote{margin-top:20px}
  .s3-quote .pq-main{font-size:38px}

  /* Scene 4 */
  .s4-body{display:flex; flex-direction:column}
  .s4-grid{display:grid; grid-template-columns:1fr 1fr; gap:22px; flex:1; min-height:0}
  .idea-panel{padding:22px 24px 18px; display:flex; flex-direction:column; min-height:0; position:relative; overflow:hidden}
  .idea-panel::after{content:""; position:absolute; left:0; top:0; width:100%; height:1px; background:linear-gradient(90deg,transparent,rgba(238,200,120,.28),transparent)}
  .idea-panel.cache::after{background:linear-gradient(90deg,transparent,rgba(127,212,197,.32),transparent)}
  .panel-top{display:flex; align-items:center; justify-content:space-between; gap:16px}
  .tag{font-family:var(--sans); font-size:11.5px; letter-spacing:.18em; text-transform:uppercase; color:var(--gold)}
  .cache .tag{color:var(--teal)}
  .tag-time{font-family:var(--sans); font-size:11.5px; letter-spacing:.09em; color:var(--dim)}
  .panel-title{margin:9px 0 0; font-family:var(--serif); font-size:31px; line-height:1.12; color:var(--ink); letter-spacing:-.018em}
  .diagram{position:relative; flex:1; min-height:0; margin-top:3px}
  .diagram svg{display:block; width:100%; height:100%; overflow:visible}
  .panel-note{margin:0; padding-top:9px; border-top:1px solid rgba(209,223,237,.075); font-family:var(--sans); font-size:13px; line-height:1.5; color:#7d8a9a}
  .s4-quote{margin-top:17px}
  .s4-quote .pq-main{font-size:31px}

  /* Scene 5 */
  .s5-body{display:flex; flex-direction:column}
  .ladder{display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:13px; flex:1; min-height:0}
  .rung{
    display:flex; flex-direction:column; min-width:0; padding:18px 17px 15px; position:relative; overflow:hidden;
    border:1px solid rgba(210,224,238,.09); border-radius:14px;
    background:linear-gradient(160deg,rgba(15,29,44,.66),rgba(5,13,22,.45));
    box-shadow:inset 0 1px 0 rgba(255,255,255,.025);
  }
  .rung::before{content:""; position:absolute; left:0; top:0; width:100%; height:2px; background:var(--accent,var(--gold)); opacity:.7}
  .rung.r0{--accent:#66778a}
  .rung.r1{--accent:var(--teal)}
  .rung.r2{--accent:var(--gold)}
  .rung.r3{--accent:var(--rose)}
  .rung.r4{--accent:#d7dae0}
  .rung-head{display:flex; align-items:center; justify-content:space-between; gap:8px}
  .rung-index{font-family:var(--sans); font-size:10px; letter-spacing:.15em; color:#6e7b8c}
  .rung-chip{font-family:var(--sans); font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--accent); opacity:.78}
  .rung-name{margin-top:11px; font-family:var(--serif); font-size:21px; line-height:1.1; letter-spacing:-.015em; color:var(--ink); min-height:47px}
  .rung-geometry{font-family:var(--sans); font-size:11.5px; line-height:1.38; letter-spacing:.035em; color:#788697; min-height:29px; margin-top:2px}
  .rung-per{display:flex; align-items:baseline; gap:5px; margin-top:13px; font-variant-numeric:tabular-nums}
  .rung-per .num{font-family:var(--serif); font-size:37px; line-height:.9; letter-spacing:-.03em; color:var(--ink)}
  .rung-per .unit{font-family:var(--serif); font-size:16px; color:var(--accent)}
  .rung-per-sub{font-family:var(--sans); font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--dim); margin-top:5px; min-height:13px}
  .rung-total{display:flex; align-items:baseline; justify-content:space-between; gap:7px; margin-top:13px; padding-top:10px; border-top:1px solid rgba(209,223,236,.08)}
  .rung-total .tk{font-family:var(--sans); font-size:10px; letter-spacing:.10em; text-transform:uppercase; color:var(--dim)}
  .rung-total .tv{font-family:var(--serif); font-size:18px; color:#e5ded2; font-variant-numeric:tabular-nums; text-align:right}
  .rung-total .tv small{display:block; margin-top:2px; font-family:var(--sans); font-size:10px; color:#7f8c9d; font-variant-numeric:normal}
  .log-wrap{margin-top:13px}
  .log-cap{display:flex; justify-content:space-between; font-family:var(--sans); font-size:9.5px; letter-spacing:.06em; color:#626f80; margin-bottom:5px}
  .log-track{height:9px; border-radius:4px; position:relative; overflow:hidden; background:rgba(164,184,203,.085); box-shadow:inset 0 1px 2px rgba(0,0,0,.25)}
  .log-track::after{content:""; position:absolute; inset:0; background-image:linear-gradient(90deg,transparent 0 calc(50% - .5px),rgba(255,255,255,.075) calc(50% - .5px) calc(50% + .5px),transparent calc(50% + .5px)); pointer-events:none}
  .log-fill{height:100%; width:0; border-radius:4px; background:linear-gradient(90deg,rgba(127,212,197,.55),var(--accent)); box-shadow:0 0 14px rgba(238,200,120,.13)}
  .log-int8{position:absolute; top:-3px; width:1px; height:15px; background:var(--teal); opacity:0; box-shadow:0 0 8px rgba(127,212,197,.7)}
  .log-legend{display:flex; align-items:center; justify-content:space-between; margin-top:6px; font-family:var(--sans); font-size:9px; letter-spacing:.04em; color:#5d6a7c}
  .log-legend .lg{display:flex; align-items:center; gap:4px}
  .log-legend .dashline{width:9px; height:1px; background:var(--teal); display:inline-block}
  .rung-shape{height:58px; min-height:58px; margin-top:12px; padding-top:9px; border-top:1px solid rgba(209,223,236,.065); display:flex; align-items:center; justify-content:center; overflow:hidden}
  .rung-shape svg{display:block; width:100%; height:52px; overflow:visible}
  .rung-what{margin:10px 0 0; font-family:var(--serif); font-size:15.5px; line-height:1.43; color:#aeb7c4}

      },
      update: function (root, t, instant) {
        applyReveals(root, t, instant);
        setDash(q(root, '#s9-line1'), instant ? 1 : prog(t, 650, 1700));
        setDash(q(root, '#s9-line2'), instant ? 1 : prog(t, 850, 1700));
        setDash(q(root, '#s9-line3'), instant ? 1 : prog(t, 1050, 1900));
        var pts = q(root, '#s9-points2');
        if (pts) { pts.style.opacity = String(instant ? 1 : prog(t, 1800, 800)); }
      }
    },
    {
      title: 'Three bets and a recommendation',
      duration: 8200,
      render: function () {
        return `
          <div class="scene-head">
            <div class="kicker" data-reveal data-start="60" data-dur="620"><span class="dash"></span>10 · The bets</div>
            <h2 data-reveal data-start="150" data-dur="820">Three ways to spend the card.</h2>
            <p class="lead" data-reveal data-start="320" data-dur="820">Each buys a different answer. Only one changes the representation.</p>

              <article class="bet b2" data-reveal data-start="560" data-dur="780">
                <div class="bet-top"><span class="bet-kicker">Bet 02 · buy</span><span class="bet-time"><span id="s10-time2">0.0</span> h</span></div>
                <div class="bet-word">Buy</div>
                <div class="bet-sub">DinoV3-B/16</div>
                <p class="bet-what">Learn whether a different trunk justifies DinoV3-L's 22 hours.</p>

                  <div class="bm-head"><span>DinoV3-B pass · L is 22 h</span><span>11 h</span></div>

                <div class="bet-question"><span class="bq-label">The question</span><span class="bq-text">Can end-to-end training cross the gap?</span></div>
                <div class="bet-meter">
                  <div class="bm-head"><span>end-to-end · more unfrozen blocks</span><span>the card</span></div>

                </div>

            <div class="recommend" data-reveal data-start="1780" data-dur="1000" data-y="18">

              <div class="rec-chip">5.5 hours</div>
            </div>
          </div>`;
      },
      update: function (root, t, instant) {
        applyReveals(root, t, instant);
        var p = instant ? 1 : prog(t, 600, 1400);
        count(q(root, '#s10-time1'), 5.5, 1, p);
        count(q(root, '#s10-time2'), 11.0, 1, p);
        var m1 = q(root, '#s10-meter1');
        var m2 = q(root, '#s10-meter2');
        if (m1) { m1.style.width = (5.5 / 24 * 100 * p).toFixed(2) + '%'; }
        if (m2) { m2.style.width = (11.0 / 24 * 100 * p).toFixed(2) + '%'; }
        var chosen = q(root, '#s10-bet1');
        if (chosen) {
          if (instant || t > 2200) { chosen.classList.add('chosen'); }
          else { chosen.classList.remove('chosen'); }
        }
      }
    }
  ];

  function updateHud(index) {
    var total = scenes.length || 10;
    if (nowEl) { nowEl.textContent = (index + 1 < 10 ? '0' : '') + (index + 1); }
    if (totalEl) { totalEl.textContent = String(total); }
    if (progressEl) { progressEl.style.width = (((index + 1) / total) * 100).toFixed(3) + '%'; }
    if (prevBtn) { prevBtn.disabled = index <= 0; }
    if (nextBtn) { nextBtn.disabled = index >= total - 1; }
  }

  function animateScene(index, root) {
    if (rafId) { caf(rafId); rafId = null; }
    var scene = scenes[index];
    if (!scene) { return; }
    var duration = scene.duration || 7200;
    if (reduceMotion) {
      scene.update(root, duration, true);
      applyReveals(root, duration, true);
      return;
    }
    var start = now();
    function tick() {
      var t = now() - start;
      scene.update(root, t, false);
      if (t < duration) {
        rafId = raf(tick);
      } else {
        scene.update(root, duration, true);
        applyReveals(root, duration, true);
        rafId = null;
      }
    }
    rafId = raf(tick);
  }

  function renderScene(index, direction) {
    if (!layer || !scenes[index]) { return; }
    if (removeTimer) { window.clearTimeout(removeTimer); removeTimer = null; }
    // Clear any scene that was left behind by very fast navigation.
    var stale = qa(layer, '.scene.leaving');
    for (var s = 0; s < stale.length; s++) {
      if (stale[s].parentNode) { stale[s].parentNode.removeChild(stale[s]); }
    }
    var old = sceneEl;
    var next = document.createElement('div');
    next.className = 'scene';
    next.setAttribute('aria-label', scenes[index].title || ('Scene ' + (index + 1)));
    if (!reduceMotion && direction !== 0) {
      next.style.opacity = '0';
      next.style.transform = 'translate3d(' + (direction < 0 ? -32 : 32) + 'px,0,0)';
    }
    next.innerHTML = scenes[index].render();
    layer.appendChild(next);

    if (old) {
      old.classList.remove('on');
      old.classList.add('leaving');
      if (!reduceMotion) {
        old.style.transform = 'translate3d(' + (direction < 0 ? 24 : -24) + 'px,0,0)';
      }
      (function (node) {
        removeTimer = window.setTimeout(function () {
          if (node && node.parentNode) { node.parentNode.removeChild(node); }
        }, reduceMotion ? 20 : 850);
      })(old);
    }

    sceneEl = next;
    if (reduceMotion || direction === 0) {
      next.classList.add('on');
      next.style.opacity = '1';
      next.style.transform = 'none';
    } else {
      // Force a style flush so the scene transition has a start value.
      void next.offsetWidth;
      raf(function () {
        next.classList.add('on');
        next.style.opacity = '1';
        next.style.transform = 'translate3d(0,0,0)';
      });
    }
    updateHud(index);
    animateScene(index, next);
  }

  function goTo(index, direction) {
    if (!scenes.length) { return; }
    var next = Math.max(0, Math.min(scenes.length - 1, index));
    if (next === current && sceneEl) { return; }
    var dir = typeof direction === 'number' ? direction : (next > current ? 1 : -1);
    current = next;
    renderScene(current, dir);
  }

  function nextScene() { goTo(current + 1, 1); }
  function prevScene() { goTo(current - 1, -1); }

  function replay() {
    if (!sceneEl) { return; }
    if (rafId) { caf(rafId); rafId = null; }
    var root = sceneEl;
    qa(root, '[data-reveal]').forEach(function (node) {
      node.style.opacity = '0';
      node.style.transform = 'translate3d(0,16px,0)';
    });
    animateScene(current, root);
  }

  function initialIndex() {
    var hash = (window.location.hash || '').replace(/^#/, '');
    var m = /^(\d{1,2})$/.exec(hash);
    if (!m) { return 0; }
    var n = parseInt(m[1], 10) - 1;
    if (isNaN(n) || n < 0) { return 0; }
    return Math.min(n, scenes.length - 1);
  }

  function fitStage() {
    if (!stage) { return; }
    var w = window.innerWidth || document.documentElement.clientWidth || DESIGN_W;
    var h = window.innerHeight || document.documentElement.clientHeight || DESIGN_H;
    var scale = Math.min(w / DESIGN_W, h / DESIGN_H);
    stage.style.transform = 'translate(-50%,-50%) scale(' + scale.toFixed(5) + ')';
  }

  function onWheel(e) {
    var dy = typeof e.deltaY === 'number' ? e.deltaY : 0;
    var dx = typeof e.deltaX === 'number' ? e.deltaX : 0;
    var d = Math.abs(dy) >= Math.abs(dx) ? dy : dx;
    if (Math.abs(d) < 2) { return; }
    if (e.cancelable) { e.preventDefault(); }
    if (wheelLocked) {
      if (wheelTimer) { window.clearTimeout(wheelTimer); }
      wheelTimer = window.setTimeout(function () { wheelLocked = false; }, 390);
      return;
    }
    wheelLocked = true;
    goTo(current + (d > 0 ? 1 : -1), d > 0 ? 1 : -1);
    if (wheelTimer) { window.clearTimeout(wheelTimer); }
    wheelTimer = window.setTimeout(function () { wheelLocked = false; }, 430);
  }

  function onKey(e) {
    if (e.defaultPrevented) { return; }
    if (e.altKey || e.ctrlKey || e.metaKey) { return; }
    var key = e.key;
    if (key === 'ArrowRight' || key === 'PageDown') {
      e.preventDefault(); nextScene();
    } else if (key === 'ArrowLeft' || key === 'PageUp') {
      e.preventDefault(); prevScene();
    } else if (key === 'Home') {
      e.preventDefault(); goTo(0, -1);
    } else if (key === 'End') {
      e.preventDefault(); goTo(scenes.length - 1, 1);
    } else if (key === 'r' || key === 'R') {
      e.preventDefault(); replay();
    }
  }

  function applyReducedState() {
    if (!reduceMotion || !sceneEl || !scenes[current]) { return; }
    if (rafId) { caf(rafId); rafId = null; }
    sceneEl.classList.add('on');
    sceneEl.style.opacity = '1';
    sceneEl.style.transform = 'none';
    scenes[current].update(sceneEl, 100000, true);
    applyReveals(sceneEl, 100000, true);
  }

  function initMediaQuery() {
    if (!window.matchMedia) { return; }
    var mq = window.matchMedia('(prefers-reduced-motion: reduce)');
    reduceMotion = !!mq.matches;
    if (typeof mq.addEventListener === 'function') {
      mq.addEventListener('change', function (ev) {
        reduceMotion = !!ev.matches;
        applyReducedState();
      });
    } else if (typeof mq.addListener === 'function') {
      mq.addListener(function (ev) {
        reduceMotion = !!ev.matches;
        applyReducedState();
      });
    }
  }

  function init() {
    initMediaQuery();
    fitStage();
    if (totalEl) { totalEl.textContent = String(scenes.length); }
    if (!layer || !scenes.length) { return; }
    current = initialIndex();
    renderScene(current, 0);
    if (prevBtn) { prevBtn.addEventListener('click', prevScene); }
    if (nextBtn) { nextBtn.addEventListener('click', nextScene); }
    window.addEventListener('resize', fitStage);
    window.addEventListener('orientationchange', fitStage);
    window.addEventListener('wheel', onWheel, { passive: false });
    document.addEventListener('keydown', onKey);
  }

  init();
})();
</script>
